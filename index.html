<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 25th Birthday, Ardell Joy 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#ffe4ec; --rose:#ff8fab; --deep:#e0446f; --wine:#8a1c3c;
    --cream:#fff8f3; --gold:#e8b86b; --ink:#4a2a35;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Quicksand',sans-serif;color:var(--ink);overflow:hidden;
    background:radial-gradient(1200px 800px at 20% 10%,#ffd6e3 0%,transparent 60%),
               radial-gradient(1000px 700px at 90% 90%,#ffe9d6 0%,transparent 60%),
               linear-gradient(160deg,#fff1f5 0%,#ffe4ec 50%,#fdd5e1 100%);
  }
  /* ---------- floating background hearts ---------- */
  #bgHearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .float-heart{position:absolute;bottom:-60px;animation:rise linear forwards;opacity:.0}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
    10%{opacity:.75}
    100%{transform:translateY(-115vh) translateX(var(--drift)) rotate(var(--rot));opacity:0}
  }
  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
    transition:opacity .9s ease, transform .9s ease}
  .hidden{opacity:0;pointer-events:none;transform:scale(.97)}

  /* ---------- welcome ---------- */
  .welcome{flex-direction:column;text-align:center;padding:24px}
  .kicker{letter-spacing:.35em;text-transform:uppercase;font-weight:600;font-size:.8rem;color:var(--deep);opacity:.85}
  .title{font-family:'Great Vibes',cursive;font-size:clamp(3.4rem,11vw,7.5rem);line-height:1;color:var(--deep);
    text-shadow:0 4px 24px rgba(224,68,111,.25);margin:.25em 0 .1em}
  .name{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.3rem,4vw,2.1rem);color:var(--wine)}
  .age{display:inline-flex;align-items:center;justify-content:center;gap:.4em;margin-top:18px;
    font-weight:700;color:var(--wine);background:rgba(255,255,255,.65);border:1px solid rgba(224,68,111,.25);
    padding:.45em 1.1em;border-radius:999px;font-size:.95rem;backdrop-filter:blur(6px)}
  .age b{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--deep)}

  /* gift box */
  .gift{position:relative;width:150px;height:150px;margin:38px auto 26px;cursor:pointer;filter:drop-shadow(0 18px 28px rgba(138,28,60,.25))}
  .gift .box{position:absolute;bottom:0;left:10px;width:130px;height:95px;border-radius:10px;
    background:linear-gradient(135deg,#ff8fab,#e0446f)}
  .gift .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:linear-gradient(#ffe7a8,#e8b86b)}
  .gift .lid{position:absolute;top:30px;left:0;width:150px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,#ff9fb7,#e85a80);transform-origin:12% 100%;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
  .gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:linear-gradient(#ffe7a8,#e8b86b)}
  .gift .bow{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:70px;height:40px}
  .gift .bow::before,.gift .bow::after{content:"";position:absolute;top:4px;width:32px;height:28px;border:7px solid #e8b86b;border-radius:50% 50% 10% 50%}
  .gift .bow::before{left:0;transform:rotate(-20deg)}
  .gift .bow::after{right:0;transform:scaleX(-1) rotate(-20deg)}
  .gift.wiggle{animation:wiggle 2.6s ease-in-out infinite}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}
  .gift.open .lid{transform:translateY(-50px) rotate(-28deg)}
  .gift.open{animation:none}

  .btn{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.08rem;letter-spacing:.03em;cursor:pointer;border:none;
    color:#fff;padding:16px 34px;border-radius:999px;
    background:linear-gradient(135deg,#ff7a9c,#e0446f);
    box-shadow:0 10px 26px rgba(224,68,111,.38), inset 0 -3px 0 rgba(0,0,0,.08);
    transition:transform .2s ease, box-shadow .2s ease}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 32px rgba(224,68,111,.45)}
  .btn:active{transform:scale(.97)}
  .btn.pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(224,68,111,.38),0 0 0 0 rgba(255,122,156,.45)}50%{box-shadow:0 10px 26px rgba(224,68,111,.38),0 0 0 16px rgba(255,122,156,0)}}
  .hint{margin-top:14px;font-size:.82rem;opacity:.65}

  /* ---------- burst hearts ---------- */
  #burst{position:fixed;inset:0;pointer-events:none;z-index:50}
  .bh{position:absolute;left:0;top:0;will-change:transform,opacity;line-height:1}

  /* ---------- slideshow ---------- */
  .show{flex-direction:column;padding:18px}
  .stage{position:relative;width:min(92vw,460px);height:min(64vh,620px);perspective:1400px}
  .card{position:absolute;inset:0;background:#fff;border-radius:18px;padding:12px 12px 64px;
    box-shadow:0 26px 60px rgba(138,28,60,.28);opacity:0;transform:rotate(var(--tilt)) scale(.92) translateY(18px);
    transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .card.active{opacity:1;transform:rotate(var(--tilt)) scale(1) translateY(0);z-index:2}
  .card.leaving{opacity:0;transform:rotate(calc(var(--tilt) * -2)) scale(1.04) translateX(-40px)}
  .card .ph{width:100%;height:100%;border-radius:10px;overflow:hidden;background:#f6e6ea}
  .card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
  .card.active img{animation:kenburns 7s ease-out forwards}
  @keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
  .card figcaption{position:absolute;left:0;right:0;bottom:14px;text-align:center;padding:0 14px;
    font-family:'Great Vibes',cursive;font-size:clamp(1.45rem,5vw,1.9rem);color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tape{position:absolute;top:-12px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(-3deg);
    background:rgba(255,200,215,.75);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:3}

  .bgphoto{position:fixed;inset:-40px;z-index:1;background-size:cover;background-position:center;filter:blur(38px) saturate(1.2);opacity:.35;transition:background-image 1s ease}

  .counter{margin-top:22px;font-weight:600;font-size:.85rem;color:var(--wine);opacity:.8}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap;max-width:90vw}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(224,68,111,.25);border:none;cursor:pointer;padding:0;transition:all .3s}
  .dot.on{background:var(--deep);width:22px;border-radius:6px}
  .controls{display:flex;gap:10px;margin-top:16px;align-items:center}
  .ctl{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.8);
    color:var(--deep);font-size:1.15rem;box-shadow:0 6px 16px rgba(138,28,60,.15);transition:transform .2s;display:grid;place-items:center}
  .ctl:hover{transform:scale(1.08)}
  .heading-sm{font-family:'Great Vibes',cursive;font-size:clamp(2rem,6vw,2.8rem);color:var(--deep);margin-bottom:16px;text-align:center}

  /* ---------- letter ---------- */
  .letter{flex-direction:column;padding:24px}
  .paper{position:relative;width:min(92vw,520px);background:var(--cream);border-radius:18px;padding:40px 34px 34px;
    box-shadow:0 26px 60px rgba(138,28,60,.22);text-align:center;
    background-image:repeating-linear-gradient(transparent 0 33px,rgba(224,68,111,.08) 33px 34px)}
  .paper h2{font-family:'Great Vibes',cursive;font-size:clamp(2.4rem,8vw,3.4rem);color:var(--deep);line-height:1.1}
  .paper p{font-size:1.04rem;line-height:1.75;margin-top:14px}
  .paper .sign{font-family:'Great Vibes',cursive;font-size:1.9rem;color:var(--wine);margin-top:18px}
  .paper .big25{position:absolute;top:-30px;right:-14px;width:76px;height:76px;border-radius:50%;
    background:linear-gradient(135deg,#ffd27f,#e8b86b);color:#fff;font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;
    display:grid;place-items:center;box-shadow:0 10px 22px rgba(232,184,107,.5);transform:rotate(10deg)}
  .row{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .btn.ghost{background:#fff;color:var(--deep);box-shadow:0 8px 20px rgba(138,28,60,.14)}

  .letter-frame{position:fixed;inset:0;z-index:55;opacity:0;pointer-events:none;transition:opacity .6s}
  .letter-frame.on{opacity:1;pointer-events:auto}
  .letter-frame iframe{width:100%;height:100%;border:0;display:block}
  .music-fab{position:fixed;top:16px;right:16px;z-index:60;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.85);color:var(--deep);font-size:1.1rem;box-shadow:0 6px 16px rgba(138,28,60,.18);display:none;place-items:center}
  .music-fab.show{display:grid}
  .music-fab.playing{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion: reduce){
    .card.active img{animation:none}
    .gift.wiggle,.btn.pulse,.music-fab.playing{animation:none}
  }
</style>
</head>
<body>

<div id="bgHearts"></div>
<div id="burst"></div>
<div class="bgphoto" id="bgPhoto" style="opacity:0"></div>
<button class="music-fab" id="musicFab" title="Music on/off" aria-label="Toggle music">♫</button>

<!-- WELCOME -->
<section class="screen welcome" id="welcome">
  <div class="kicker">November · a very special day</div>
  <h1 class="title">Happy Birthday, Boss</h1>
  <div class="name">Ardell Joy Francisco</div>
  <div class="age">turning <b>25</b> today ✨</div>

  <div class="gift wiggle" id="gift" aria-hidden="true">
    <div class="box"></div>
    <div class="lid"><div class="bow"></div></div>
  </div>

  <button class="btn pulse" id="openBtn">Open your gift 🎁</button>
  <div class="hint">turn your sound on 🔊</div>
</section>

<!-- SLIDESHOW -->
<section class="screen show hidden" id="show">
  <div class="heading-sm">Us, so far 💕</div>
  <div class="stage" id="stage"></div>
  <div class="counter" id="counter">1 / 14</div>
  <div class="dots" id="dots"></div>
  <div class="controls">
    <button class="ctl" id="prev" aria-label="Previous">‹</button>
    <button class="ctl" id="play" aria-label="Pause">❚❚</button>
    <button class="ctl" id="next" aria-label="Next">›</button>
  </div>
</section>

<!-- FINALE -->
<section class="screen letter hidden" id="letter">
  <div class="paper">
    <div class="big25">25</div>
    <h2>One more thing…</h2>
    <p>Happy birthday, boss. Before you go, there's a letter waiting just for you.</p>
    <div class="row">
      <button class="btn pulse" id="openLetter">Open your letter 💌</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="moreHearts">More hearts 💗</button>
      <button class="btn ghost" id="replay">Watch again ↺</button>
    </div>
  </div>
</section>

<div class="letter-frame" id="letterFrame"><iframe id="letterIframe" title="A letter for Ardell"></iframe></div>

<script>
/* ======================= DATA ======================= */
const SLIDES = [
  ["photos/01.jpg","Matching outfits, matching hearts"],
  ["photos/02.jpg","Every meal is better with you"],
  ["photos/03.jpg","My favorite kind of chaos"],
  ["photos/04.jpg","You, me & a whole beach of sand"],
  ["photos/05.jpg","Sunsets look prettier next to you"],
  ["photos/06.jpg","Home is wherever you lean on me"],
  ["photos/07.jpg","Thumbs up for us, always"],
  ["photos/08.jpg","Walking every road with you"],
  ["photos/09.jpg","Front row to my favorite story"],
  ["photos/10.jpg","Even the mirrors know we're cute"],
  ["photos/11.jpg","Next stop: forever"],
  ["photos/12.jpg","Pouts & peace signs"],
  ["photos/13.jpg","Shining brighter than the city"],
  ["photos/14.jpg","25 looks beautiful on you"]
];
const HEARTS = ["💖","💗","💕","💞","💓","❤️","🩷","💘"];
const $ = id => document.getElementById(id);

/* preload */
SLIDES.forEach(s => { const i = new Image(); i.src = s[0]; });

/* ======================= FLOATING BG HEARTS ======================= */
function spawnFloat(){
  const h = document.createElement('span');
  h.className = 'float-heart';
  h.textContent = HEARTS[Math.random()*HEARTS.length|0];
  const size = 14 + Math.random()*26;
  const dur = 9 + Math.random()*9;
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = size + 'px';
  h.style.setProperty('--drift', (Math.random()*160-80) + 'px');
  h.style.setProperty('--rot', (Math.random()*90-45) + 'deg');
  h.style.animationDuration = dur + 's';
  $('bgHearts').appendChild(h);
  setTimeout(() => h.remove(), dur*1000);
}
for (let i=0;i<10;i++) setTimeout(spawnFloat, i*400);
setInterval(spawnFloat, 900);

/* ======================= HEART BURST ======================= */
const particles = [];
let rafOn = false;
function burst(x, y, count=110, spread=1){
  const layer = $('burst');
  for (let i=0;i<count;i++){
    const el = document.createElement('span');
    el.className = 'bh';
    el.textContent = HEARTS[Math.random()*HEARTS.length|0];
    el.style.fontSize = (16 + Math.random()*30) + 'px';
    layer.appendChild(el);
    const a = Math.random()*Math.PI*2;
    const sp = (6 + Math.random()*13) * spread;
    particles.push({el, x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 7, r:Math.random()*360, vr:Math.random()*14-7, life:0, max:90+Math.random()*70});
  }
  if (!rafOn){ rafOn = true; requestAnimationFrame(tick); }
}
function rain(count=60){
  const layer = $('burst');
  for (let i=0;i<count;i++){
    const el = document.createElement('span');
    el.className='bh';
    el.textContent = HEARTS[Math.random()*HEARTS.length|0];
    el.style.fontSize = (16 + Math.random()*26) + 'px';
    layer.appendChild(el);
    particles.push({el, x:Math.random()*innerWidth, y:-40 - Math.random()*innerHeight*0.6, vx:Math.random()*2-1, vy:2+Math.random()*3, r:0, vr:Math.random()*4-2, life:0, max:220});
  }
  if (!rafOn){ rafOn = true; requestAnimationFrame(tick); }
}
function tick(){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.vy += 0.22; p.vx *= 0.985;
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    const o = Math.max(0, 1 - p.life/p.max);
    p.el.style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`;
    p.el.style.opacity = o;
    if (o<=0 || p.y > innerHeight+80){ p.el.remove(); particles.splice(i,1); }
  }
  if (particles.length) requestAnimationFrame(tick); else rafOn = false;
}

/* ======================= MUSIC (original music-box tune, Web Audio) ======================= */
let ctx, master, musicOn = false, schedTimer = null, nextTime = 0, step = 0;
const EIGHTH = 60/88/2;
const midi = n => 440 * Math.pow(2,(n-69)/12);
const CH = { F:[53,60,65,69], Dm:[50,57,62,65], Bb:[46,53,58,62], C:[48,55,60,64] };
// chord per half-bar (16 halves = 8 bars)
const PROG = ["F","F","Dm","Dm","Bb","Bb","C","C","F","F","Dm","Dm","Bb","C","F","F"];
// melody: [bar, eighth, midi, lengthInEighths]
const MEL = [
 [0,0,72,2],[0,2,77,2],[0,4,76,1],[0,5,77,1],[0,6,81,2],
 [1,0,81,2],[1,2,77,2],[1,4,74,4],
 [2,0,74,2],[2,2,77,1],[2,3,76,1],[2,4,74,2],[2,6,72,2],
 [3,0,72,2],[3,2,74,2],[3,4,76,2],[3,6,79,2],
 [4,0,81,3],[4,3,79,1],[4,4,77,2],[4,6,72,2],
 [5,0,74,2],[5,2,77,2],[5,4,81,2],[5,6,79,2],
 [6,0,77,2],[6,2,74,2],[6,4,76,2],[6,6,79,2],
 [7,0,77,6],[7,6,72,2]
];
const melMap = {};
MEL.forEach(([b,e,n,l]) => { melMap[b*8+e] = [n,l]; });

function makeReverb(){
  const len = ctx.sampleRate * 2.6, buf = ctx.createBuffer(2,len,ctx.sampleRate);
  for (let c=0;c<2;c++){ const d = buf.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.8); }
  const conv = ctx.createConvolver(); conv.buffer = buf; return conv;
}
function initAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0;
  const rev = makeReverb(), wet = ctx.createGain(); wet.gain.value = 0.35;
  master.connect(ctx.destination); master.connect(rev); rev.connect(wet); wet.connect(ctx.destination);
}
function bell(freq, t, vol, dur){
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
  o1.type='sine'; o1.frequency.value=freq;
  o2.type='sine'; o2.frequency.value=freq*4.01; g2.gain.value=0.12;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function pad(notes, t, dur){
  notes.forEach(n => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='triangle'; o.frequency.value = midi(n-12+12);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.018,t+0.6);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1);
  });
}
function scheduler(){
  while (nextTime < ctx.currentTime + 0.25){
    const s = step % 64;            // 8 bars * 8 eighths
    const half = Math.floor(s/4), within = s%4;
    const chord = CH[PROG[half]];
    // arpeggio: root, fifth, octave, third
    const arp = [chord[0]+12, chord[1]+12, chord[2]+12, chord[3]];
    bell(midi(arp[within]), nextTime, 0.07, 1.3);
    if (within===0){ bell(midi(chord[0]), nextTime, 0.06, 2.2); pad(chord.slice(1), nextTime, EIGHTH*4); }
    const m = melMap[s];
    if (m) bell(midi(m[0]), nextTime, 0.16, Math.max(1.4, m[1]*EIGHTH*1.8));
    nextTime += EIGHTH; step++;
  }
}
function startMusic(){
  try{
    initAudio();
    if (ctx.state === 'suspended') ctx.resume();
    nextTime = ctx.currentTime + 0.1;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 1.5);
    clearInterval(schedTimer); schedTimer = setInterval(scheduler, 30);
    musicOn = true; $('musicFab').classList.add('playing'); $('musicFab').textContent='♫';
  }catch(e){ /* audio unavailable */ }
}
function stopMusic(){
  if (!ctx) return;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
  master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
  setTimeout(() => clearInterval(schedTimer), 650);
  musicOn = false; $('musicFab').classList.remove('playing'); $('musicFab').textContent='🔇';
}
$('musicFab').onclick = () => musicOn ? stopMusic() : startMusic();

/* ======================= SLIDESHOW ======================= */
const stage = $('stage'), dots = $('dots');
let cur = 0, timer = null, playing = true;
const DUR = 4800;
SLIDES.forEach(([src,cap],i) => {
  const f = document.createElement('figure');
  f.className='card';
  f.style.setProperty('--tilt', ((i%2?1:-1)*(1+Math.random()*2.2)).toFixed(2)+'deg');
  f.innerHTML = `<div class="tape"></div><div class="ph"><img src="${src}" alt="${cap}" loading="eager"></div><figcaption>${cap}</figcaption>`;
  stage.appendChild(f);
  const d = document.createElement('button'); d.className='dot'; d.setAttribute('aria-label','Photo '+(i+1));
  d.onclick = () => { go(i); restart(); };
  dots.appendChild(d);
});
const cards = [...stage.children], dotEls = [...dots.children];

function go(i){
  const prev = cards[cur];
  prev.classList.remove('active'); prev.classList.add('leaving');
  setTimeout(() => prev.classList.remove('leaving'), 1100);
  cur = (i + SLIDES.length) % SLIDES.length;
  const c = cards[cur];
  c.classList.remove('leaving');
  const img = c.querySelector('img'); img.style.animation='none'; void img.offsetWidth; img.style.animation='';
  c.classList.add('active');
  dotEls.forEach((d,k) => d.classList.toggle('on', k===cur));
  $('counter').textContent = `${cur+1} / ${SLIDES.length}`;
  $('bgPhoto').style.backgroundImage = `url(${SLIDES[cur][0]})`;
  if (cur % 4 === 0 && cur) { const r = stage.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height*0.2, 22, 0.6); }
}
function advance(){
  if (cur === SLIDES.length-1){ toLetter(); return; }
  go(cur+1);
}
function restart(){ clearInterval(timer); if (playing) timer = setInterval(advance, DUR); }
$('next').onclick = () => { if (cur === SLIDES.length-1) toLetter(); else { go(cur+1); restart(); } };
$('prev').onclick = () => { go(cur-1); restart(); };
$('play').onclick = () => {
  playing = !playing;
  $('play').textContent = playing ? '❚❚' : '▶';
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  restart();
};
document.addEventListener('keydown', e => {
  if ($('show').classList.contains('hidden')) return;
  if (e.key==='ArrowRight') $('next').click();
  if (e.key==='ArrowLeft') $('prev').click();
  if (e.key===' ') { e.preventDefault(); $('play').click(); }
});
let tx = null;
stage.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
stage.addEventListener('touchend', e => {
  if (tx===null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 40) (dx<0 ? $('next') : $('prev')).click();
  tx = null;
});

function show(id){
  ['welcome','show','letter'].forEach(s => $(s).classList.toggle('hidden', s!==id));
}
function startShow(){
  show('show');
  $('bgPhoto').style.opacity = '.35';
  cards.forEach(c => c.classList.remove('active','leaving'));
  cur = 0; cards[0].classList.add('active');
  dotEls.forEach((d,k) => d.classList.toggle('on', k===0));
  $('counter').textContent = `1 / ${SLIDES.length}`;
  $('bgPhoto').style.backgroundImage = `url(${SLIDES[0][0]})`;
  playing = true; $('play').textContent='❚❚'; restart();
}
function toLetter(){
  clearInterval(timer);
  show('letter');
  $('bgPhoto').style.opacity = '0';
  setTimeout(() => rain(80), 400);
}

/* ======================= OPEN GIFT ======================= */
$('openBtn').onclick = (e) => {
  const gift = $('gift');
  gift.classList.remove('wiggle'); gift.classList.add('open');
  $('openBtn').classList.remove('pulse');
  $('openBtn').disabled = true;
  startMusic();
  $('musicFab').classList.add('show');
  const r = gift.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/3, 140);
  setTimeout(() => burst(innerWidth*0.2, innerHeight*0.4, 50, .8), 350);
  setTimeout(() => burst(innerWidth*0.8, innerHeight*0.4, 50, .8), 600);
  setTimeout(() => rain(70), 800);
  setTimeout(startShow, 2600);
};
$('gift').onclick = () => { if (!$('openBtn').disabled) $('openBtn').click(); };
$('moreHearts').onclick = (e) => { burst(e.clientX, e.clientY, 120); rain(40); };
$('openLetter').onclick = () => {
  const f = $('letterIframe');
  if (!f.src) f.src = 'letter.html#embed';
  $('letterFrame').classList.add('on');
};
window.addEventListener('message', e => { if (e.data === 'close-letter') $('letterFrame').classList.remove('on'); });
$('replay').onclick = () => { startShow(); burst(innerWidth/2, innerHeight/2, 60, .8); };
</script>
</body>
